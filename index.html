<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgüitaTech | Lettuce for Vegetables traceability</title>
<meta name="description" content="AgüitaTech | Lettuce for Vegetables traceability. Batch, process and human-review records with simulated demonstration data.">
<meta name="theme-color" content="#1f6b45">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6b45'/%3E%3Cpath d='M16 5c0 0-8 9-8 14a8 8 0 0 0 16 0c0-5-8-14-8-14z' fill='%23d9ecf8'/%3E%3Cpath d='M12 22c0-4 3-7 8-8-1 5-4 8-8 8z' fill='%231f6b45'/%3E%3C/svg%3E">
<style>
  :root {
    --leaf: #1f6b45;
    --leaf-dark: #154d31;
    --leaf-soft: #e4f0e8;
    --water: #1d5f8c;
    --water-dark: #164a6d;
    --water-soft: #e3eef7;
    --ink: #17212b;
    --muted: #51606c;
    --bg: #f2f5f3;
    --surface: #ffffff;
    --line: #d5ddd8;
    --line-strong: #9aa8a1;
    --amber-ink: #7a4a00;
    --amber-bg: #fff4d9;
    --amber-line: #e0b155;
    --red-ink: #9b1c1c;
    --red-bg: #fdeeee;
    --red-line: #e5a3a3;
    --gray-ink: #3f4a54;
    --gray-bg: #edf0f2;
    --demo-ink: #4a3b00;
    --demo-bg: #fff8d6;
    --demo-line: #d9c25a;
    --focus: #f0a400;
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); }
  a { color: var(--water); }
  a:hover { color: var(--water-dark); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  .skip { position: absolute; left: -9999px; top: 0; z-index: 100; background: var(--ink); color: #fff; padding: 10px 14px; }
  .skip:focus { left: 8px; top: 8px; }
  .id { font-variant-numeric: tabular-nums; letter-spacing: .015em; font-weight: 700; overflow-wrap: anywhere; }

  /* Header */
  .topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
  .topbar-inner { display: flex; align-items: center; gap: 18px; min-height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .brand-name { font-size: 1.28rem; font-weight: 750; letter-spacing: -.01em; line-height: 1.1; }
  .brand-name span { display: block; font-size: .78rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .nav { display: flex; gap: 4px; flex: 1; }
  .nav button {
    font: inherit; font-size: .95rem; font-weight: 600; color: var(--muted); background: none; border: 0;
    padding: 10px 14px; border-radius: 10px; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; gap: 8px;
  }
  .nav button svg { width: 20px; height: 20px; flex: none; }
  .nav button:hover { background: var(--leaf-soft); color: var(--leaf-dark); }
  .nav button[aria-current="page"] { background: var(--leaf); color: #fff; }
  .role { display: flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--muted); flex: none; }
  .role label { white-space: nowrap; font-weight: 600; }
  .role select { width: auto; min-height: 40px; padding: 6px 10px; font-size: .92rem; }
  body.public-mode .nav, body.public-mode .role { display: none; }

  main { padding: 22px 16px 56px; }
  main:focus { outline: none; }
  h1 { font-size: 1.65rem; line-height: 1.2; margin: 0 0 6px; letter-spacing: -.01em; }
  h2 { font-size: 1.18rem; line-height: 1.3; margin: 0 0 12px; }
  h3 { font-size: 1rem; margin: 0 0 8px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: .875rem; }
  .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .panel > h2:first-child { margin-top: 0; }
  .grid-main { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 980px) { .grid-main { grid-template-columns: minmax(0, 1.85fr) minmax(300px, 1fr); align-items: start; } }
  @media (max-width: 979px) { .grid-main > aside { order: -1; } }

  /* Stats */
  .stats { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 16px; }
  @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; border-top: 4px solid var(--line-strong); }
  .stat .n { font-size: 2rem; font-weight: 750; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: .9rem; color: var(--muted); }
  .stat.s-incomplete { border-top-color: var(--amber-line); }
  .stat.s-review { border-top-color: var(--water); }
  .stat.s-hold { border-top-color: var(--red-ink); }
  .stat.s-total { border-top-color: var(--leaf); }

  /* Notices */
  .notice { border: 1px solid; border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; }
  .notice strong { display: block; }
  .notice ul { margin: 6px 0 0; padding-left: 20px; }
  .n-info { background: var(--water-soft); border-color: #a9c6de; color: var(--water-dark); }
  .n-warn { background: var(--amber-bg); border-color: var(--amber-line); color: var(--amber-ink); }
  .n-stop { background: var(--red-bg); border-color: var(--red-line); color: var(--red-ink); }
  .n-review { background: var(--surface); border-color: var(--line-strong); border-left: 5px solid var(--leaf); color: var(--ink); font-weight: 600; }
  .n-public { background: var(--surface); border: 2px solid var(--ink); font-weight: 600; font-size: 1.02rem; }
  .demo-banner { background: var(--demo-bg); border: 2px dashed var(--demo-line); color: var(--demo-ink); border-radius: 12px; padding: 10px 14px; margin: 0 0 14px; text-align: center; font-weight: 800; letter-spacing: .06em; }

  /* Badges */
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; border: 1px solid; font-size: .84rem; font-weight: 650; line-height: 1.35; white-space: normal; }
  .b-draft { background: var(--gray-bg); color: var(--gray-ink); border-color: #c4ccd3; }
  .b-incomplete { background: var(--amber-bg); color: var(--amber-ink); border-color: var(--amber-line); }
  .b-awaiting, .b-complete { background: var(--water-soft); color: var(--water-dark); border-color: #a9c6de; }
  .b-hold { background: var(--red-bg); color: var(--red-ink); border-color: var(--red-line); }
  .b-disposition { background: var(--surface); color: var(--ink); border-color: var(--ink); }
  .b-example { background: var(--demo-bg); color: var(--demo-ink); border-color: var(--demo-line); font-weight: 600; }

  /* Forms */
  label, .lbl { font-weight: 600; font-size: .93rem; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; min-width: 0; }
  .hint { font-size: .84rem; color: var(--muted); }
  .req { color: var(--red-ink); }
  input[type=text], input[type=url], input[type=date], input[type=time], input[type=datetime-local], input[type=search], select, textarea {
    font: inherit; font-size: 1rem; color: var(--ink); background: #fff; width: 100%;
    border: 1px solid #8d9a94; border-radius: 10px; padding: 10px 12px; min-height: 46px;
  }
  textarea { min-height: 84px; resize: vertical; }
  .cols { display: grid; gap: 0 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 0 0 14px; }
  legend { font-weight: 700; padding: 0 6px; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin: 8px 0; }
  .check input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--leaf); }
  .form-error:empty { display: none; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px;
    padding: 10px 18px; border-radius: 10px; border: 1px solid var(--leaf); background: var(--leaf); color: #fff;
    font: inherit; font-size: .97rem; font-weight: 650; cursor: pointer; text-decoration: none; text-align: center;
  }
  .btn:hover { background: var(--leaf-dark); border-color: var(--leaf-dark); color: #fff; }
  .btn-alt { background: #fff; color: var(--leaf-dark); border-color: var(--line-strong); }
  .btn-alt:hover { background: var(--leaf-soft); color: var(--leaf-dark); border-color: var(--leaf); }
  .btn-water { background: var(--water); border-color: var(--water); }
  .btn-water:hover { background: var(--water-dark); border-color: var(--water-dark); }
  .btn-hold { background: #fff; color: var(--red-ink); border-color: var(--red-ink); }
  .btn-hold:hover { background: var(--red-bg); color: var(--red-ink); border-color: var(--red-ink); }
  .btn-sm { min-height: 40px; padding: 7px 12px; font-size: .9rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: .85rem; color: var(--muted); font-weight: 650; background: var(--bg); }
  tbody tr:hover { background: #f8faf9; }
  .table-wrap { overflow-x: auto; }
  @media (min-width: 1025px) {
    table.cards td .id { white-space: nowrap; }
    table.cards td[data-label="Harvest date"], table.cards .t-actions .btn { white-space: nowrap; }
    table.cards .t-actions .actions { flex-direction: column; align-items: stretch; }
  }
  @media (max-width: 1024px) {
    table.cards thead { position: absolute; left: -9999px; }
    table.cards tr { display: block; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; background: #fff; padding: 6px 4px; }
    table.cards td { display: grid; grid-template-columns: 8.6em minmax(0, 1fr); gap: 10px; border: 0; padding: 7px 10px; }
    table.cards td::before { content: attr(data-label); font-weight: 650; color: var(--muted); font-size: .86rem; }
    table.cards td.t-actions { grid-template-columns: 1fr; padding-top: 10px; }
    table.cards td.t-actions::before { display: none; }
    table.cards td.t-actions .btn { flex: 1 1 auto; }
  }

  /* Recently updated */
  .recent { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin-bottom: 18px; }
  .recent a { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-decoration: none; color: var(--ink); }
  .recent a:hover { border-color: var(--leaf); background: #fbfdfc; color: var(--ink); }
  .recent .id { display: block; color: var(--water); margin-bottom: 6px; }
  .recent .when { display: block; font-size: .84rem; color: var(--muted); margin-top: 6px; }

  /* Lists */
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }
  .list .grow { flex: 1; min-width: 0; }
  .flag { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; }
  .tag { flex: none; font-size: .76rem; font-weight: 700; border-radius: 6px; padding: 1px 7px; border: 1px solid; }
  .t-missing { background: var(--amber-bg); color: var(--amber-ink); border-color: var(--amber-line); }
  .t-review { background: var(--water-soft); color: var(--water-dark); border-color: #a9c6de; }
  .t-hold { background: var(--red-bg); color: var(--red-ink); border-color: var(--red-line); }
  dl.kv { display: grid; grid-template-columns: minmax(140px, 38%) minmax(0, 1fr); gap: 8px 14px; margin: 0; }
  dl.kv dt { color: var(--muted); font-weight: 600; font-size: .92rem; }
  dl.kv dd { margin: 0; overflow-wrap: anywhere; }
  @media (max-width: 560px) { dl.kv { grid-template-columns: 1fr; gap: 2px; } dl.kv dd { margin-bottom: 8px; } }

  /* Batch header */
  .batch-head { display: grid; gap: 14px; }
  .batch-id { font-size: clamp(1.45rem, 4.4vw, 2.2rem); line-height: 1.1; margin: 0; }
  .meta { display: grid; gap: 8px 18px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin: 0; }
  .meta dt { font-size: .82rem; color: var(--muted); font-weight: 600; }
  .meta dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

  /* Process strip: the water path from source to cold chain */
  .strip { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); position: relative; }
  .strip::before { content: ""; position: absolute; left: 8%; right: 8%; top: 17px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--water), var(--leaf)); opacity: .35; }
  .strip li { position: relative; text-align: center; padding: 0 4px; }
  .strip .dot { width: 38px; height: 38px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 3px solid var(--line-strong); color: var(--muted); font-weight: 750; font-size: .9rem; position: relative; }
  .strip .st-recorded .dot { border-color: var(--leaf); background: var(--leaf); color: #fff; }
  .strip .st-missing .dot { border-color: var(--amber-line); background: var(--amber-bg); color: var(--amber-ink); }
  .strip .st-review .dot { border-color: var(--water); background: var(--water-soft); color: var(--water-dark); }
  .strip .st-hold .dot { border-color: var(--red-ink); background: var(--red-bg); color: var(--red-ink); }
  .strip .st-optional .dot { border-style: dashed; }
  .strip .name { display: block; font-weight: 650; font-size: .88rem; line-height: 1.25; }
  .strip .state { display: block; font-size: .8rem; color: var(--muted); }
  @media (max-width: 700px) {
    .strip { grid-template-columns: 1fr; gap: 0; }
    .strip::before { left: 18px; right: auto; top: 10px; bottom: 10px; width: 4px; height: auto; background: linear-gradient(180deg, var(--water), var(--leaf)); }
    .strip li { display: grid; grid-template-columns: 38px 1fr; column-gap: 12px; text-align: left; padding: 4px 0; align-items: center; }
    .strip .dot { margin: 0; grid-row: span 2; }
  }

  /* Sections */
  details.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; }
  details.sec > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; gap: 10px; align-items: center; justify-content: space-between; min-height: 56px; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary .t { font-weight: 700; display: flex; align-items: center; gap: 10px; }
  details.sec > summary .t::before { content: ""; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; flex: none; }
  details.sec[open] > summary .t::before { transform: rotate(45deg); }
  details.sec .body { padding: 0 16px 16px; }
  .sstate { font-size: .84rem; color: var(--muted); text-align: right; }
  .sstate.missing { color: var(--amber-ink); font-weight: 600; }
  .sstate.hold { color: var(--red-ink); font-weight: 600; }
  .note-line { font-size: .88rem; color: var(--muted); border-left: 3px solid var(--water); padding: 2px 10px; margin: 0 0 12px; }
  .saved { font-size: .84rem; color: var(--muted); margin: 10px 0 12px; }

  /* Timeline */
  ol.tl { list-style: none; margin: 0; padding: 0; position: relative; }
  ol.tl::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 3px; background: var(--line); border-radius: 2px; }
  ol.tl li { position: relative; padding: 0 0 14px 28px; }
  ol.tl li::before { content: ""; position: absolute; left: 0; top: 5px; width: 17px; height: 17px; border-radius: 50%; background: #fff; border: 3px solid var(--water); box-sizing: border-box; }
  ol.tl .ev { font-weight: 700; }

  /* Public page */
  .pub { max-width: 760px; margin: 0 auto; }
  .pub-head { background: linear-gradient(135deg, var(--leaf) 0%, var(--water) 100%); color: #fff; border-radius: 16px; padding: 22px 20px; margin-bottom: 16px; }
  .pub-head .k { font-size: .9rem; opacity: .9; margin: 0 0 4px; }
  .pub-head .batch-id { color: #fff; }
  .pub-head dl { margin: 14px 0 0; display: grid; gap: 10px 18px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .pub-head dt { font-size: .8rem; opacity: .85; }
  .pub-head dd { margin: 0; font-weight: 650; }
  .pub-rows { list-style: none; margin: 0; padding: 0; }
  .pub-rows li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .pub-rows li:last-child { border-bottom: 0; }
  .pub-rows .v { font-weight: 650; text-align: right; }

  /* Modal */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(15, 30, 24, .55); display: flex; justify-content: center; align-items: flex-start; padding: 24px 12px; overflow-y: auto; }
  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 540px; padding: 20px; }
  .qr-box { display: flex; justify-content: center; margin: 12px 0; }
  .qr-box svg { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; }
  .linkbox { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; overflow-wrap: anywhere; max-height: 7.5em; overflow-y: auto; }

  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 70; width: max-content; max-width: calc(100vw - 32px); }
  #toast .msg { background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, .22); }
  #printArea { display: none; }

  /* Small screens: bottom tab bar */
  @media (max-width: 860px) {
    .topbar-inner { min-height: 58px; justify-content: space-between; }
    .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); gap: 2px; }
    .nav button { flex: 1; flex-direction: column; gap: 2px; font-size: .74rem; padding: 6px 2px; min-height: 56px; border-radius: 10px; }
    body:not(.public-mode) main { padding-bottom: 110px; }
    body:not(.public-mode) #toast { bottom: 84px; }
    .brand { flex: 1 1 auto; min-width: 0; }
    .brand-name { font-size: 1.12rem; }
    .brand-name span { font-size: .72rem; line-height: 1.25; }
    .role { flex-direction: column; align-items: flex-end; gap: 2px; }
    .role label { font-size: .72rem; }
    .role select { min-height: 40px; padding: 4px 8px; font-size: .88rem; }
  }

  @media print {
    .topbar, .nav, .actions, #toast, .no-print { display: none !important; }
    body { background: #fff; }
    main { padding: 0; }
    .panel, .pub-head { border-color: #999; break-inside: avoid; }
    .pub-head { background: #fff !important; color: #000; border: 2px solid #000; }
    .pub-head .batch-id { color: #000; }
    body.printing-qr > *:not(#printArea) { display: none !important; }
    body.printing-qr #printArea { display: block; text-align: center; padding-top: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<a class="skip" href="#main">Skip to main content</a>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#/dashboard" id="brandLink" aria-label="AgüitaTech home">

      <span class="brand-name">AgüitaTech<span>Lettuce for Vegetables traceability</span></span>
    </a>
    <nav class="nav" aria-label="Main">

  function submitBatch(form, b) {

      .filter(function (p) { return !v[p[0]]; }).map(function (p) { return p[1]; });
    if (need.length) { formError(err, 'Fill in: ' + need.join(', ') + '.'); return; }
    if (anyClaim(v)) { formError(err, TXT.CLAIM); return; }
    var keys = ['producer', 'region', 'country', 'crop', 'variety', 'harvestDate', 'harvestTime', 'block', 'quantity', 'enteredBy', 'notes'];
    if (b) {
      keys.forEach(function (k) { b[k] = v[k] || ''; });
      b.ozonePlanned = !!v.ozonePlanned;
      touchRecords(b);
      log(b.id, 'Edited batch details');
      save(); toast('Batch saved');
      go('#/batch/' + encodeURIComponent(b.id));
      return;
    }
    var id = (v.id || '').toUpperCase();
    if (id) {
      if (!ID_RE.test(id)) { formError(err, 'Batch ID can use letters, numbers and hyphens (3–40 characters).'); return; }
      if (state.batches[id]) { formError(err, 'Batch ID ' + id + ' already exists. Use a different ID.'); return; }
    } else id = newId(v.harvestDate);
    var t = nowISO(), nb = { id: id, demo: '', ozonePlanned: !!v.ozonePlanned, harvestReview: 'pending', createdAt: t, updatedAt: t, recordsUpdatedAt: t, records: {}, readings: [], events: [], review: [] };
    keys.forEach(function (k) { nb[k] = v[k] || ''; });

  function newId(date) {
    var day = (/^\d{4}-\d{2}-\d{2}$/.test(date || '') ? date : todayLocal()).replace(/-/g, '');
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    for (var n = 0; n < 500; n++) {
      var a = new Uint32Array(4), s = '';
      try { crypto.getRandomValues(a); } catch (e) { for (var j = 0; j < 4; j++) a[j] = Math.floor(Math.random() * 1e9); }
      for (var i = 0; i < 4; i++) s += chars.charAt(a[i] % chars.length);
      var id = 'LETTUCE-' + day + '-' + s;
      if (!state.batches[id]) return id;
    }
    return 'LETTUCE-' + day + '-' + Date.now().toString(36).toUpperCase().slice(-4);
  }

    b.review.push({ id: uid(), action: action, reviewerRole: v.reviewerRole, reviewerName: v.reviewerName || '', note: v.note || '',

  /* ---------- Events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-nav]');
    if (!t) return;
    var nav = t.getAttribute('data-nav');
    if (nav) { go('#/' + nav); return; }
    var a = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    var cur = location.hash.indexOf('#/batch/') === 0 ? getBatch(decodeURIComponent(location.hash.slice(8))) : null;
    switch (a) {
      case 'view': go('#/batch/' + encodeURIComponent(id)); break;
      case 'edit': go('#/edit/' + encodeURIComponent(id)); break;
      case 'qr': openQR(id); break;
      case 'overlay': if (e.target === t) closeModal(); break;
      case 'close': closeModal(); break;
      case 'copy':
        var done = function () { toast('Link copied'); };
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(qrState.url).then(done, selectLink);
        else selectLink();
        break;
      case 'download-qr':
        try {
          var canvas = QR.toCanvas(qrState.code, 10);
          canvas.toBlob(function (blob) { if (blob) downloadBlob(blob, 'qr-' + qrState.b.id + '.png'); else toast('Download is not available in this browser.'); }, 'image/png');
        } catch (x) { toast('Download is not available in this browser.'); }
        break;
      case 'print-qr': printQR(); break;
      case 'print-page': window.print(); break;
      case 'export':
        var bx = getBatch(id);
        if (bx) {
          var ev = evaluate(bx);
          var data = { exportedAt: nowISO(), simulated: !!bx.demo, status: ev.status, openItems: ev.flags.map(function (f) { return f.text; }), batch: bx };
          downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), bx.id + '.json');
          toast('Record exported');
        }
        break;
      case 'delete':
        if (role !== 'operator' || !state.batches[id]) return;
        if (!window.confirm('Delete batch ' + id + '? This cannot be undone.')) return;
        delete state.batches[id];
        log(id, 'Deleted batch');
        save(); toast('Batch deleted');
        go('#/dashboard');
        break;
      case 'edit-sec': if (cur) { ui.editing[t.getAttribute('data-key')] = true; viewBatch(cur.id); } break;
      case 'cancel-edit': if (cur) { ui.editing[t.getAttribute('data-key')] = false; viewBatch(cur.id); } break;
      case 'review': if (cur) recordReview(cur, t.getAttribute('data-a')); break;
      case 'event-review':
        if (!cur || role !== 'reviewer') return;
        var eid = t.getAttribute('data-eid');
        if (eid === 'harvest') cur.harvestReview = 'complete';
        else cur.events.forEach(function (x) { if (x.id === eid) x.review = 'complete'; });
        cur.updatedAt = nowISO();
        log(cur.id, 'Marked an event reviewed');
        ui.open.events = true; save(); toast('Event marked reviewed'); viewBatch(cur.id);
        break;
      case 'del-event':
      case 'del-reading':
        if (!cur || role !== 'operator') return;
        var rid = t.getAttribute(a === 'del-event' ? 'data-eid' : 'data-rid');
        if (a === 'del-event') { cur.events = cur.events.filter(function (x) { return x.id !== rid; }); ui.open.events = true; log(cur.id, 'Removed an event'); }
        else { cur.readings = cur.readings.filter(function (x) { return x.id !== rid; }); ui.open.readings = true; log(cur.id, 'Removed a reading'); }
        touchRecords(cur); save(); toast('Removed'); viewBatch(cur.id);
        break;
      case 'clear-base':
        settings.publicBase = ''; writeJSON(SETTINGS_KEY, settings); toast('Settings saved'); viewSettings();
        break;
      case 'reset':
        if (!window.confirm('Reset demonstration data? All batches in this browser are replaced by the three demonstration batches.')) return;
        state = seed(); fromStorage = true; ui = { open: {}, editing: {} }; dash = { q: '', status: '' };
        save(); toast('Demonstration data reset');

        break;

      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === root.querySelector('.modal'))) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  document.getElementById('roleSelect').addEventListener('change', function (e) {
    role = e.target.value;
    try { localStorage.setItem(ROLE_KEY, role); } catch (x) { /* role stays for this visit */ }
    ui.editing = {};

  try { var r0 = localStorage.getItem(ROLE_KEY); if (ROLE_LABEL[r0]) role = r0; } catch (e) { storageOK = false; }
  var s0 = readJSON(SETTINGS_KEY);
  if (s0 && typeof s0.publicBase === 'string') settings.publicBase = s0.publicBase;
  state = readJSON(DATA_KEY);

  else {
    state = seed();
    if (!PUBLIC_MODE && writeJSON(DATA_KEY, state)) fromStorage = true;
  }
  document.getElementById('roleSelect').value = role;
  route();
})();
